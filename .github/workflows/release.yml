name: surum
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  paketle:
    # Test ve paketleme yazma yetkisi olmadan; yayımlama ayrı işte, yalnız hazır dosyalarla
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: etiket ve sürüm aynı mı
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}"
      - run: python -m pip install ".[test]" && python -m pytest -q
      - run: python scripts/paketle.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/council-hafiza-*.zip
            dist/SHA256SUMS.txt
  yayimla:
    needs: paketle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: sürümü yayımla
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/council-hafiza-*.zip dist/SHA256SUMS.txt \
            --title "$GITHUB_REF_NAME" --notes "Kurulum için README'deki cümleyi Claude Code'a yazın."
