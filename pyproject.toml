[project]
name = "council-hafiza"
version = "0.2.5"
description = "COUNCIL: bütün yapay zeka araçlarının ortak hafızası (MCP sunucusu)"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["fastmcp>=4.1,<5", "numpy>=1.26", "certifi"]

[project.optional-dependencies]
vektor = ["sentence-transformers>=3", "torch"]
test = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]
sifreleme = ["sqlcipher3-binary>=0.5"]

[project.scripts]
council-hafiza = "council_hafiza.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["council_hafiza"]

[tool.setuptools.package-data]
council_hafiza = ["*.html", "*.js", "*.css", "fontlar/*"]
